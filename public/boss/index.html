<style>
  /* loading screen: shown before any JS runs, removed once the tower has baked */
  #boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(120% 90% at 50% 20%,#f6efe3 0%,#e7eef7 60%,#dfe7f2 100%);font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif;color:#1d2433;transition:opacity .5s ease}
  #boot.done{opacity:0;pointer-events:none}
  #boot .mark{width:84px;height:84px;border-radius:22px;background:#c8322a;display:grid;place-items:center;box-shadow:0 14px 34px rgba(200,50,42,.32);animation:float 2.4s ease-in-out infinite}
  #boot .mark svg{width:52px;height:52px}
  #boot h1{margin:0;font:600 22px/1.2 "Noto Sans SC","PingFang SC",system-ui,sans-serif;letter-spacing:.04em}
  #boot p{margin:-10px 0 0;font-size:12px;color:#5a6478;letter-spacing:.08em}
  #boot .bar{width:220px;height:4px;border-radius:4px;background:rgba(22,48,90,.12);overflow:hidden}
  #boot .bar i{display:block;height:100%;width:8%;background:#16305a;border-radius:4px;transition:width .3s ease}
  @keyframes float{50%{transform:translateY(-6px)}}
  @media (prefers-color-scheme: dark){#boot{background:radial-gradient(120% 90% at 50% 20%,#1b2540 0%,#0f172a 70%);color:#eef1f7}#boot p{color:#a5afc3}#boot .bar{background:rgba(255,255,255,.12)}#boot .bar i{background:#e9eef8}}
  @media (prefers-reduced-motion: reduce){#boot .mark{animation:none}}
</style>
  <script type="module" crossorigin src="./assets/index-cHw6_aig.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CQtRIQKs.css">
</head>
<body>
<div id="boot" role="status" aria-live="polite">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 52 52" fill="none"><rect x="13" y="6" width="26" height="42" rx="2.5" fill="#fff"/><g fill="#c8322a"><rect x="17" y="11" width="7" height="4" rx="1"/><rect x="28" y="11" width="7" height="4" rx="1"/><rect x="17" y="19" width="7" height="4" rx="1"/><rect x="28" y="19" width="7" height="4" rx="1"/><rect x="17" y="27" width="7" height="4" rx="1"/><rect x="28" y="27" width="7" height="4" rx="1"/><rect x="22" y="38" width="8" height="10" rx="1"/></g><rect x="8" y="46" width="36" height="3" rx="1.5" fill="#fff"/></svg>
  </div>
  <h1>Paul 的大楼</h1>
  <p>PAUL HQ</p>
  <div class="bar"><i id="boot-bar"></i></div>
</div>
<div id="root"></div>
<script>
  (function () {
    var bar = document.getElementById("boot-bar"), boot = document.getElementById("boot"), p = 8;
    var tick = setInterval(function () { p = Math.min(85, p + (90 - p) * 0.08); bar.style.width = p + "%"; }, 120);
    addEventListener("office-progress", function (e) { var v = Math.max(p, e.detail || 0); p = v; bar.style.width = v + "%"; });
    function done() { clearInterval(tick); bar.style.width = "100%"; setTimeout(function () { boot.classList.add("done"); setTimeout(function () { boot.remove(); }, 600); }, 250); }
    addEventListener("office-loaded", done);
    setTimeout(done, 15000);
  })();
</script>
</body>
