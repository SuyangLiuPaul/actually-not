<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 图标只用几何图形，不含文字：避免依赖系统字体，任何尺寸下都一致。
       语义：一个「对勾」被红笔划掉 —— 你以为对的，其实不是。
       红线刻意比对勾细，且几乎水平，这样在 16px 下两者不会糊成一团。 -->
