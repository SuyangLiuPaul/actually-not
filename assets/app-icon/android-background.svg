<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 先别急着信 Android adaptive BACKGROUND v1.3 (paper only): same concept A「划掉」, refined materials. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#fcf9f3"/>
      <stop offset="1" stop-color="#ece5d8"/>
    </linearGradient>
    <radialGradient id="light" cx="0.3" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edge" cx="0.5" cy="0.45" r="0.72">
      <stop offset="0.62" stop-color="#b9a685" stop-opacity="0"/>
      <stop offset="1" stop-color="#b09c7b" stop-opacity="0.34"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.33  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 1.3 -0.5"/>
    </filter>
    <linearGradient id="ink" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#3a352f"/>
      <stop offset="0.55" stop-color="#1d1b18"/>
      <stop offset="1" stop-color="#0e0d0c"/>
    </linearGradient>
    <linearGradient id="inkSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0" stop-color="#c8322a"/>
      <stop offset="0.45" stop-color="#e2493b"/>
      <stop offset="1" stop-color="#d23c2f"/>
    </linearGradient>
    <linearGradient id="penShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#5e0d08" stop-opacity="0"/>
      <stop offset="1" stop-color="#5e0d08" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="ambient" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="contact" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="penSoft" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="tickClip"><path d="M300 520 L452 672 L742 336" fill="none" stroke="#000" stroke-width="110" stroke-linecap="round" stroke-linejoin="round"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#paper)"/>
  <rect width="1024" height="1024" fill="url(#light)"/>
  <rect width="1024" height="1024" fill="url(#edge)"/>
  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.06"/>
  </svg>
