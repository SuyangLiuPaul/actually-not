    <g transform="translate(512 512) scale(1.12) translate(-518 -504)">
      <path d="M300 520 L452 672 L742 336" fill="none" stroke="#1c1a17" stroke-width="124"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M200 560 C400 526 640 494 862 486 A32 32 0 0 1 870 550 C650 564 420 624 212 666 A54 54 0 0 1 200 560 Z"
            fill="#c8352a"/>
    </g>
  </g>
</svg>
