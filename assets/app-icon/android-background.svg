<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Android adaptive BACKGROUND: paper only (same edge deepening as the iOS icon). -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7f0"/>
      <stop offset="1" stop-color="#ebe3d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.34" cy="0.24" r="0.78">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- v1.2: the paper deepens toward the edges so the icon keeps its silhouette on light wallpaper -->
    <radialGradient id="edge" cx="0.5" cy="0.46" r="0.74">
      <stop offset="0.55" stop-color="#cbbb9f" stop-opacity="0"/>
      <stop offset="1" stop-color="#bfae90" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.30  0 0 0 0 0.22  0 0 0 1.4 -0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#paper)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <rect width="1024" height="1024" fill="url(#edge)"/>
  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.10"/>
</svg>
