<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Concept A · 「划掉」Strike, refined.
       The site's existing mark (an ink tick struck by a red pen), redrawn as two physical layers:
       paper (background) + ink tick (mid) + red pen stroke floating above with a soft cast shadow.
       Full-bleed square: iOS applies its own squircle mask; Android uses the split layers. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcf9f3"/>
      <stop offset="1" stop-color="#ece5d8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2a25"/>
      <stop offset="1" stop-color="#121110"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#d9463a"/>
      <stop offset="1" stop-color="#a9261b"/>
    </linearGradient>
    <linearGradient id="penHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.30  0 0 0 0 0.22  0 0 0 1.4 -0.45"/>
    </filter>
    <filter id="inkShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#paper)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- paper grain: a whisper of texture, invisible below ~120px -->
  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.10"/>
  <g transform="translate(512 512) scale(1.1) translate(-518 -504)">
    <!-- ink tick: soft contact shadow then the stroke -->
    <path d="M300 520 L452 672 L742 336" fill="none" stroke="#1c1a17" stroke-opacity="0.18"
          stroke-width="118" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 14)" filter="url(#inkShadow)"/>
    <path d="M300 520 L452 672 L742 336" fill="none" stroke="url(#ink)"
          stroke-width="118" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- red pen stroke: a brush mark, pressed on the left, lifted off to the right; floats above the ink -->
    <path d="M206 568 C400 534 640 504 860 500 A16 16 0 0 1 866 532 C650 552 420 616 214 656 A44 44 0 0 1 206 568 Z" fill="#5a120c" opacity="0.32"
          transform="translate(6 26)" filter="url(#soft)"/>
    <path d="M206 568 C400 534 640 504 860 500 A16 16 0 0 1 866 532 C650 552 420 616 214 656 A44 44 0 0 1 206 568 Z" fill="url(#pen)"/>
    <path d="M206 568 C400 534 640 504 860 500 A16 16 0 0 1 866 532 C650 552 420 616 214 656 A44 44 0 0 1 206 568 Z" fill="url(#penHi)"/>
  </g>
</svg>
