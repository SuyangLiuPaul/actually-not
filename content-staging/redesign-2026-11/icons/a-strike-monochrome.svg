<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Monochrome layer (Android 13+ themed icons; also the basis for the iOS tinted variant).
       One flat colour on transparency. The pen stroke is cut out of the tick with a gap so the two
       marks stay separable when the system tints them. Same geometry/scale as the adaptive foreground. -->
  <defs>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g transform="translate(512 512) scale(0.7) translate(-512 -512)"><g transform="translate(512 512) scale(1.1) translate(-518 -504)"><path d="M206 568 C400 534 640 504 860 500 A16 16 0 0 1 866 532 C650 552 420 616 214 656 A44 44 0 0 1 206 568 Z" fill="#000" stroke="#000" stroke-width="48" stroke-linejoin="round"/></g></g>
    </mask>
  </defs>
  <g mask="url(#gap)"><g transform="translate(512 512) scale(0.7) translate(-512 -512)"><g transform="translate(512 512) scale(1.1) translate(-518 -504)">
    <path d="M300 520 L452 672 L742 336" fill="none" stroke="#000" stroke-width="118" stroke-linecap="round" stroke-linejoin="round"/>
  </g></g></g>
  <g transform="translate(512 512) scale(0.7) translate(-512 -512)"><g transform="translate(512 512) scale(1.1) translate(-518 -504)"><path d="M206 568 C400 534 640 504 860 500 A16 16 0 0 1 866 532 C650 552 420 616 214 656 A44 44 0 0 1 206 568 Z" fill="#000"/></g></g>
</svg>
