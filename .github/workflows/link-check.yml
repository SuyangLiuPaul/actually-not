name: 链接体检

# 每月 3 号早上跑一次（UTC 01:17 ≈ 北京时间 09:17）；也可手动触发
on:
  schedule:
    - cron: '17 1 3 * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-links:
    name: 出处链接体检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # CI 上没有系统 Chrome，用 Playwright 自带的 Chromium（不渲染中文，不需要字体）
      - run: npx playwright install --with-deps chromium

      - name: 跑链接体检
        id: check
        run: USE_BUNDLED_CHROMIUM=1 npm run links
        continue-on-error: true

      - name: 发现失效链接时开 issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="链接体检发现失效出处（$(date +%Y-%m-%d)）"
          EXISTING=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            echo "已有未处理的体检 issue #$EXISTING，不再重复开"
            exit 0
          fi
          gh issue create \
            --title "$TITLE" \
            --body "月度链接体检发现有出处打不开（见本次 workflow 运行日志）。

          处理原则（HANDOVER 第 6 节）：
          1. 先找同一结论的替代出处；
          2. 确认不了的，只保留文献信息、删掉链接，不要留死链。" \
            --label "bug"
          exit 1 # 让这次运行保持失败状态，列表里一眼能看到
