<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Concept C · 「不等于」Not equal.
       Two paper bars (what you heard = what is true) cut by one red pen stroke.
       A mathematical sign, not a letter: reads the same in Chinese and English. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#4b6b76"/>
      <stop offset="1" stop-color="#22363d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#e9e1d1"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b02a1e"/>
      <stop offset="0.5" stop-color="#da4334"/>
      <stop offset="1" stop-color="#bf3022"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#ground)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g>
    <rect x="232" y="372" width="560" height="104" rx="52" fill="#0b1417" opacity="0.35" transform="translate(0 18)" filter="url(#soft)"/>
    <rect x="232" y="560" width="560" height="104" rx="52" fill="#0b1417" opacity="0.35" transform="translate(0 18)" filter="url(#soft)"/>
    <rect x="232" y="372" width="560" height="104" rx="52" fill="url(#bar)"/>
    <rect x="232" y="560" width="560" height="104" rx="52" fill="url(#bar)"/>
    <!-- tapered red slash -->
    <path d="M360 812 Q520 500 688 190 A10 10 0 0 1 706 200 Q556 520 414 838 A28 28 0 0 1 360 812 Z" fill="#2a0906" opacity="0.4"
          transform="translate(10 22)" filter="url(#soft)"/>
    <path d="M360 812 Q520 500 688 190 A10 10 0 0 1 706 200 Q556 520 414 838 A28 28 0 0 1 360 812 Z" fill="url(#pen)"/>
  </g>
</svg>
