[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── netlify.app 旧域名 301 到主域名 ─────────────────────────
# Netlify 号称会自动重定向到主域名，实测（2026-08-31）并没有：
# actually-not.netlify.app 仍返回 200。所以显式写死。
# 必须排在下面的 SPA 兜底之前——首个匹配生效。
[[redirects]]
  from = "https://actually-not.netlify.app/*"
  to = "https://actually-not.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://actually-not.netlify.app/*"
  to = "https://actually-not.com/:splat"
  status = 301
  force = true

# YouTube 简介里用过 /m/<条目>/ 的链接（2026-11-09 的 10 支短片），条目真实地址是 /<条目>/。
# 301 过去，别让它落进 SPA 兜底变成首页。
[[redirects]]
  from = "/m/*"
  to = "/:splat"
  status = 301
  force = true

# 单页应用：所有路径都回到 index.html
# BEGIN ACTUALLY_NOT_TOWN (managed local integration)
# Do not force a /town -> /town/ redirect: Netlify normalises trailing slashes.
[[redirects]]
  from = "/town"
  to = "/town/index.html"
  status = 200

# Real release files shadow this rule; missing modules must NOT receive the SPA.
[[redirects]]
  from = "/town/*"
  to = "/town/404.html"
  status = 404
# END ACTUALLY_NOT_TOWN

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Service worker 绝不能被缓存，否则用户会卡在旧版本上
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# 远程内容（原生 App 不发版更新内容用，见 HANDOVER「不发版更新内容」）：
# 短缓存 + 必须回源验证；App 的 WebView 来源是 capacitor://localhost（iOS）/ https://localhost（Android），
# 是跨域请求，所以要 CORS。内容公开、不带凭据，用 * 即可。
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# BEGIN ACTUALLY_NOT_TOWN_HEADERS
[[headers]]
  for = "/town"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/town/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/town/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/town/release.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/town/404.html"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/town/releases/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# END ACTUALLY_NOT_TOWN_HEADERS
