[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── netlify.app 旧域名 301 到主域名 ─────────────────────────
# Netlify 号称会自动重定向到主域名，实测（2026-08-31）并没有：
# actually-not.netlify.app 仍返回 200。所以显式写死。
# 必须排在下面的 SPA 兜底之前——首个匹配生效。
[[redirects]]
  from = "https://actually-not.netlify.app/*"
  to = "https://actually-not.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://actually-not.netlify.app/*"
  to = "https://actually-not.com/:splat"
  status = 301
  force = true

# 单页应用：所有路径都回到 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Service worker 绝不能被缓存，否则用户会卡在旧版本上
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
