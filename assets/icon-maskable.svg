<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- maskable 版本：Android 会把图标裁成圆形等形状，
       所有内容必须落在中心 80% 的安全区内，所以整体缩到 ~66% 并铺满背景。 -->
  <rect width="512" height="512" fill="#f7f4ee"/>
  <g transform="translate(256 256) scale(0.66) translate(-256 -256)">
    <path d="M132 252 L226 346 L392 148"
          fill="none" stroke="#1c1a17" stroke-width="58"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M74 322 Q 256 296 438 312"
          fill="none" stroke="#cf3a30" stroke-width="30" stroke-linecap="round"/>
  </g>
</svg>
