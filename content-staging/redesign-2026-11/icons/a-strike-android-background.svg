<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Android adaptive icon BACKGROUND: paper only. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcf9f3"/>
      <stop offset="1" stop-color="#ece5d8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2a25"/>
      <stop offset="1" stop-color="#121110"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#d9463a"/>
      <stop offset="1" stop-color="#a9261b"/>
    </linearGradient>
    <linearGradient id="penHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.30  0 0 0 0 0.22  0 0 0 1.4 -0.45"/>
    </filter>
    <filter id="inkShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#paper)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
</svg>
