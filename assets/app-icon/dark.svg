<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 先别急着信 app icon v1.3 DARK appearance: ink paper, paper-coloured tick, brighter pen. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#28241f"/>
      <stop offset="1" stop-color="#0f0e0c"/>
    </linearGradient>
    <radialGradient id="light" cx="0.3" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edge" cx="0.5" cy="0.45" r="0.72">
      <stop offset="0.62" stop-color="#b9a685" stop-opacity="0"/>
      <stop offset="1" stop-color="#b09c7b" stop-opacity="0.34"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.33  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 1.3 -0.5"/>
    </filter>
    <linearGradient id="ink" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fdfaf3"/>
      <stop offset="0.55" stop-color="#ebe3d4"/>
      <stop offset="1" stop-color="#d6ccb9"/>
    </linearGradient>
    <linearGradient id="inkSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0" stop-color="#e2493d"/>
      <stop offset="0.45" stop-color="#f66b5d"/>
      <stop offset="1" stop-color="#e5503f"/>
    </linearGradient>
    <linearGradient id="penShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#5e0d08" stop-opacity="0"/>
      <stop offset="1" stop-color="#5e0d08" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="ambient" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="contact" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="penSoft" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="tickClip"><path d="M300 520 L452 672 L742 336" fill="none" stroke="#000" stroke-width="110" stroke-linecap="round" stroke-linejoin="round"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#paper)"/>
  <rect width="1024" height="1024" fill="url(#light)"/>
  
  <g transform="translate(512 512) scale(1.08) translate(-520 -506)">
    <!-- tick: ambient + contact shadow, ink body, top sheen -->
    <path d="M300 520 L452 672 L742 336" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="110" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 30)" filter="url(#ambient)"/>
    <path d="M300 520 L452 672 L742 336" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="110" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 8)" filter="url(#contact)"/>
    <path d="M300 520 L452 672 L742 336" fill="none" stroke="url(#ink)" stroke-width="110" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M300 520 L452 672 L742 336" fill="none" stroke="url(#inkSheen)" stroke-width="110" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- pen stroke: brush-shaped, heavy rounded start, tapering to a fine tip -->
    <path d="M214 572 C420 540 650 512 872 506 C884 506 886 520 874 523 C660 548 430 610 226 654 C178 664 166 580 214 572 Z" fill="#4a0d08" opacity="0.30" transform="translate(4 20)" filter="url(#penSoft)"/>
    <path d="M214 572 C420 540 650 512 872 506 C884 506 886 520 874 523 C660 548 430 610 226 654 C178 664 166 580 214 572 Z" fill="#2a0604" opacity="0.35" clip-path="url(#tickClip)" transform="translate(2 9)"/>
    <path d="M214 572 C420 540 650 512 872 506 C884 506 886 520 874 523 C660 548 430 610 226 654 C178 664 166 580 214 572 Z" fill="url(#pen)"/>
    <path d="M214 572 C420 540 650 512 872 506 C884 506 886 520 874 523 C660 548 430 610 226 654 C178 664 166 580 214 572 Z" fill="url(#penShade)"/>
    <path d="M232 590 C420 560 640 530 840 516" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
