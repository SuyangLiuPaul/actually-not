name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上只跑最新一次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 内容完整性测试
        run: npm test

      - name: 构建
        run: npm run build

      - name: 确认产物齐全
        run: |
          set -euo pipefail
          for f in \
            dist/index.html \
            dist/manifest.webmanifest \
            dist/sw.js \
            dist/favicon.ico \
            dist/favicon.svg \
            dist/og.png \
            dist/icons/apple-touch-icon.png \
            dist/icons/icon-192.png \
            dist/icons/icon-512.png \
            dist/icons/maskable-192.png \
            dist/icons/maskable-512.png \
            dist/_redirects \
            dist/_headers
          do
            test -s "$f" || { echo "缺少产物：$f"; exit 1; }
          done
          echo "产物齐全。"
