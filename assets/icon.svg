<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="512" height="512">
  <!-- 小尺寸图标（favicon、浏览器标签、PWA）：v1.2 图标 A「划掉」的扁平版。
       只用几何图形、不含文字；没有阴影和纸纹（16px 下会糊），红笔比 App 图标里更粗，
       右端是圆钝的收笔。App 图标的母版在 assets/app-icon/。 -->
  <rect width="1024" height="1024" rx="228" fill="#f1ebdf"/>
  <g transform="translate(512 512) scale(1.12) translate(-518 -504)">
    <path d="M300 520 L452 672 L742 336" fill="none" stroke="#1c1a17" stroke-width="124"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M200 560 C400 526 640 494 862 486 A32 32 0 0 1 870 550 C650 564 420 624 212 666 A54 54 0 0 1 200 560 Z"
          fill="#c8352a"/>
  </g>
</svg>
